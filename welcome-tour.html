<div class="modal-content welcome-tour-card">
    <span class="close" id="welcome-close">&times;</span>
    <div class="welcome-eyebrow">Welcome</div>
    <h2 class="welcome-title">How ShiftyWords works</h2>

    <div class="welcome-stage" aria-hidden="true">
        <div class="welcome-finger" id="welcome-finger"></div>

        <div class="demo-columns" id="demo-columns">
            <!-- 5 columns, populated by JS -->
        </div>

        <div class="demo-preview" id="demo-preview">
            <div class="demo-preview-tile" data-pos="0">·</div>
            <div class="demo-preview-tile" data-pos="1">·</div>
            <div class="demo-preview-tile" data-pos="2">·</div>
            <div class="demo-preview-tile" data-pos="3">·</div>
            <div class="demo-preview-tile" data-pos="4">·</div>
        </div>
    </div>

    <div class="welcome-caption" id="welcome-caption">Tap a letter from each column to build your guess.</div>

    <div class="welcome-progress" id="welcome-progress">
        <span class="dot active" data-step="0"></span>
        <span class="dot" data-step="1"></span>
        <span class="dot" data-step="2"></span>
        <span class="dot" data-step="3"></span>
    </div>

    <div class="welcome-actions">
        <button class="welcome-cta" id="welcome-cta">Got it. Let me play.</button>
    </div>
</div>
